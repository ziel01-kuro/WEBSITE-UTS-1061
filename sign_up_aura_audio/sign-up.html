<!-- Registration Card -->
<div class="neumorphic-extruded rounded-xl p-8 md:p-12 w-full max-w-md relative z-10 transition-all duration-300">
<div class="text-center mb-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Create Account</h1>
<p class="text-secondary font-body-md text-sm">Join the AURA ecosystem.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-2 ml-1" for="fullName">FULL NAME</label>
<input class="w-full neumorphic-inset rounded-lg px-4 py-3 text-on-surface input-focus-glow transition-all duration-300" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-2 ml-1" for="email">EMAIL ADDRESS</label>
<input class="w-full neumorphic-inset rounded-lg px-4 py-3 text-on-surface input-focus-glow transition-all duration-300" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-2 ml-1" for="password">PASSWORD</label>
<input class="w-full neumorphic-inset rounded-lg px-4 py-3 text-on-surface input-focus-glow transition-all duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-caps text-label-caps text-secondary mb-2 ml-1" for="confirmPassword">CONFIRM PASSWORD</label>
<input class="w-full neumorphic-inset rounded-lg px-4 py-3 text-on-surface input-focus-glow transition-all duration-300" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>

<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 rounded-lg tracking-widest mt-8 btn-active transition-all duration-300 hover:bg-inverse-primary shadow-[0_0_15px_rgba(155,81,224,0.3)]" type="submit">

                </button>
</form>
